      id: total-amount
    timeout: 15000
- assertVisible: 151.99 AUD
- takeScreenshot: android-ready
- scrollUntilVisible:
    element:
      id: details-rec-001
    direction: DOWN
- tapOn:
    id: details-rec-001
- assertVisible: 2026-10-01
- takeScreenshot: android-details
- tapOn:
    id: close-details
- scrollUntilVisible:
    element:
      id: details-rec-002
    direction: DOWN
- tapOn:
    id: details-rec-002
- assertVisible: 2026-10-03
- tapOn:
    id: close-details
- scrollUntilVisible:
