- tapOn: Show roots
- tapOn:
    id: android:id/title
    text: Downloads
- tapOn: statement.csv
- assertVisible:
    id: confirm-import
- assertVisible: statement.csv
- takeScreenshot: android-confirmation
- tapOn:
    id: confirm-import
- extendedWaitUntil:
