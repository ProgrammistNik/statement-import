appId: com.nikitasokolov.statementimport
---
- launchApp:
    clearState: true
- assertVisible:
    id: screen-title
- startRecording: android-stale-status
- scrollUntilVisible:
    element:
      id: pick-file
    direction: DOWN
- tapOn:
    id: pick-file
- tapOn: Show roots
- tapOn:
    id: android:id/title
    text: Downloads
- tapOn: statement.csv
- assertVisible:
    id: confirm-import
- tapOn:
    id: confirm-import
- extendedWaitUntil:
    visible:
      id: total-amount
    timeout: 15000
- assertVisible: 151.99 AUD
- scrollUntilVisible:
    element:
      id: open-diagnostics
    direction: UP
- tapOn:
    id: open-diagnostics
- scrollUntilVisible:
    element:
      id: diagnostic-counts
    direction: DOWN
- scrollUntilVisible:
    element:
      id: refresh-diagnostics
    direction: DOWN
- tapOn:
    id: refresh-diagnostics
- scrollUntilVisible:
    element:
      id: diagnostic-counts
    direction: UP
- assertVisible: "(?s).*Ревизия: 3.*Отброшено ответов: 1.*"
- takeScreenshot: android-stale-ignored
- scrollUntilVisible:
    element:
      id: back-main
    direction: DOWN
- tapOn:
    id: back-main
- scrollUntilVisible:
    element:
      id: total-amount
    direction: UP
- assertVisible: 151.99 AUD
- stopRecording
